onboarding = false
[ui.sound]
enabled = false

[ui]
show_agent_labels_on_pane_borders = true
prompt_new_tab_name = false

agent_panel_sort = "spaces"

status_indicators = "symbols"
[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab"], ["agent", "state_text"]]

[keys]
prefix = "ctrl+j"
toggle_sidebar = "prefix+backslash"
navigate_workspace_up = "k"
navigate_workspace_down = "j"

[[keys.command]]
key = "prefix+v"
type = "popup"
command = "devmux dashboard"
description = "Open devmux dashboard"
width = "90%"
height = "75%"

[[keys.command]]
key = "prefix+shift+v"
type = "shell"
command = "herdr-pbpaste"
description = "Paste macOS clipboard into focused pane"

[[keys.command]]
key = "prefix+shift+l"
type = "popup"
command = "lazygit"
description = "Open lazygit"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+shift+o"
type = "shell"
command = "herdr-open-pr"
description = "Open current branch PR"

[[keys.command]]
key = "prefix+u"
type = "popup"
command = "herdr-copy-pr"
description = "Copy current branch PR URL"
width = "80%"
height = "25%"

[theme]
name = "catppuccin"
auto_switch = false

[ui.toast]
delivery = "herdr"
