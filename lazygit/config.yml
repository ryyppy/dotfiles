# Lazygit configuration
#
# Don't show an extra confirmation prompt after returning from subprocesses,
# e.g. after opening a file with `e`.
promptToReturnFromSubprocess: false

# Keep shell-launched lazygit predictable: opening a file starts `nvim`
# in the current terminal instead of trying to reuse an existing Neovim server.
os:
  editPreset: nvim
  # Make Lazygit's `o` action safe: reveal files / open directories in Finder
  # instead of letting macOS execute/open files via arbitrary file associations.
  open: 'lazygit-open -- {{filename}}'
